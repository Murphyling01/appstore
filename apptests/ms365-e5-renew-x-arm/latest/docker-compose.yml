services:
  ms365-e5-renew-x-arm64v8:
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:1066"
    environment:
      - TZ=${TIME_ZONE}
      - sender=${TIME_ZONE}
      - pwd=${TIME_ZONE}
      - receiver=${TIME_ZONE}
      - adminpwd=${TIME_ZONE}
    image: hanhongyong/ms365-e5-renew-x:arm64v8
    labels:  
      createdBy: "Apps"

networks:  
  1panel-network:  
    external: true